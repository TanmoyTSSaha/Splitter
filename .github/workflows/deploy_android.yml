name: Deploy Android

on:
  push:
    branches: [Master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy_android.yml'
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        required: true
        type: choice
        default: internal
        options: [internal, beta, production]
      rollout_fraction:
        description: Staged rollout 0.0-1.0 (production only)
        required: false
        type: string

concurrency:
  group: deploy-android
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live in the internal environment; track input only selects Fastlane lane.
    environment: internal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Materialize .env stub
        run: cp .env.example .env

      - name: Materialize env.prod.json
        env:
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          if [ -z "$PROD_ENV_JSON" ]; then
            echo "PROD_ENV_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$PROD_ENV_JSON" > env.prod.json

      - name: Validate production env
        run: node ../../scripts/validate-env-prod.mjs env.prod.json

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Verify Android signing fingerprints
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GCP_ANDROID_OAUTH_UPLOAD_SHA1: ${{ secrets.GCP_ANDROID_OAUTH_UPLOAD_SHA1 }}
          GCP_ANDROID_OAUTH_PLAY_SIGNING_SHA1: ${{ secrets.GCP_ANDROID_OAUTH_PLAY_SIGNING_SHA1 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Android signing secrets are required for fingerprint verification"
            exit 1
          fi
          if [ -z "$GCP_ANDROID_OAUTH_UPLOAD_SHA1" ]; then
            echo "GCP_ANDROID_OAUTH_UPLOAD_SHA1 secret is not set"
            echo "Run keytool on upload-keystore.jks and register SHA-1 in GCP Android OAuth client"
            exit 1
          fi
          if [ -z "$GCP_ANDROID_OAUTH_PLAY_SIGNING_SHA1" ]; then
            echo "GCP_ANDROID_OAUTH_PLAY_SIGNING_SHA1 secret is not set"
            echo "Register Play app-signing SHA-1 in GCP Android OAuth client (Play Console → App signing)"
            exit 1
          fi
          KEYTOOL_ERR=$(mktemp)
          KEYTOOL_OUT=$(keytool -list -v \
            -keystore android/upload-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>"$KEYTOOL_ERR") || {
            echo "keytool failed to read upload keystore (check alias and store password)"
            exit 1
          }
          rm -f "$KEYTOOL_ERR"
          ACTUAL_SHA1=$(echo "$KEYTOOL_OUT" | grep -m1 'SHA1:' | sed 's/.*SHA1:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d '\r')
          EXPECTED_SHA1=$(echo "$GCP_ANDROID_OAUTH_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]' | tr -d '\r')
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "Could not extract SHA-1 from upload keystore"
            exit 1
          fi
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Upload keystore SHA-1 does not match GCP_ANDROID_OAUTH_UPLOAD_SHA1"
            echo "Update the GitHub secret or re-register the fingerprint in GCP Android OAuth client"
            exit 1
          fi
          echo "Upload keystore SHA-1 matches GCP_ANDROID_OAUTH_UPLOAD_SHA1"

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Android signing secrets are not fully configured"
            exit 1
          fi
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=../upload-keystore.jks" \
            > android/key.properties

      - name: Materialize Play Store service account key
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          KEY_FILE="${RUNNER_TEMP}/play-store-key.json"
          if [ -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "$PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$KEY_FILE"
          elif [ -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$PLAY_STORE_SERVICE_ACCOUNT_JSON" > "$KEY_FILE"
          else
            echo "Set PLAY_STORE_SERVICE_ACCOUNT_JSON or PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 in the internal environment"
            exit 1
          fi
          python3 -c "import json; json.load(open('$KEY_FILE'))" || {
            echo "Play Store service account JSON is invalid. Re-paste the full GCP key JSON (or base64) into GitHub internal environment secrets."
            exit 1
          }
          echo "PLAY_STORE_JSON_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Test 16 KB AAB checker
        run: python3 ../../scripts/check-aab-16kb.test.py

      - name: Resolve build number from Play
        id: version
        env:
          BUILD_NUMBER_FILE: ${{ runner.temp }}/next-build-number.txt
        run: |
          cd android
          bundle exec fastlane print_next_build_number
          BUILD_NUMBER=$(tr -d '\r\n' < "$BUILD_NUMBER_FILE")
          if ! echo "$BUILD_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Could not resolve build number from Play API"
            exit 1
          fi
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Configure CI build memory
        run: |
          # ubuntu-latest has 7 GB RAM; R8 minify + Gradle -Xmx4G often OOMs.
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - name: Build release app bundle
        run: |
          if [ -z "$BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER is empty"
            exit 1
          fi
          mkdir -p build/app build/debug-info
          flutter --version
          echo "Building with versionCode=$BUILD_NUMBER"
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=env.prod.json \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json

      - name: Verify 16 KB native library alignment
        run: python3 ../../scripts/check-aab-16kb.py build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: split0
          SENTRY_PROJECT: splitr
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping Sentry symbol upload"
            exit 0
          fi
          dart run sentry_dart_plugin

      - name: Upload to Play Store
        env:
          ROLLOUT_FRACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_fraction || '' }}
          FASTLANE_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY_PATH" ]; then
            echo "PLAY_STORE_JSON_KEY_PATH is not set"
            exit 1
          fi
          cd android
          bundle exec fastlane "$FASTLANE_LANE"
