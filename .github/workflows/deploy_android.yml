name: Deploy Android

on:
  push:
    branches: [Master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy_android.yml'
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        required: true
        type: choice
        options: [beta, production]
      rollout_fraction:
        description: Staged rollout 0.0-1.0 (production only)
        required: false
        type: string

concurrency:
  group: deploy-android
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Materialize .env stub
        run: cp .env.example .env

      - name: Materialize env.prod.json
        env:
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          if [ -z "$PROD_ENV_JSON" ]; then
            echo "PROD_ENV_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$PROD_ENV_JSON" > env.prod.json

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Android signing secrets are not fully configured"
            exit 1
          fi
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=../upload-keystore.jks" \
            > android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Resolve build number from Play
        id: version
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set +e
          BUILD_NUMBER=$(cd android && bundle exec fastlane print_next_build_number 2>/dev/null | tail -n 1 | tr -d '\r')
          if ! echo "$BUILD_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Play API unavailable; defaulting build number to 2"
            BUILD_NUMBER=2
          fi
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Build release app bundle
        run: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=env.prod.json \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json

      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: split0
          SENTRY_PROJECT: splitr
        run: dart run sentry_dart_plugin

      - name: Upload to Play Store
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          ROLLOUT_FRACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.rollout_fraction || '' }}
          FASTLANE_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.track || 'internal' }}
        run: |
          if [ -z "$PLAY_STORE_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_STORE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          cd android
          bundle exec fastlane "$FASTLANE_LANE"
