name: Flutter CI

on:
  push:
    branches: [Master, develop]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter_ci.yml'

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Materialize .env stub
        run: cp .env.example .env

      - name: Materialize google-services.json
        run: cp android/app/google-services.json.example android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
