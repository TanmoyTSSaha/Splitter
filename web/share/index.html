<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Splitr summary</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #666; --accent: #1de9b6; }
    body { font-family: Poppins, system-ui, sans-serif; color: var(--fg); max-width: 420px; margin: 2rem auto; padding: 1rem; }
    h1 { font-family: Georgia, serif; font-weight: 600; margin: 0 0 1rem; }
    .card { border: 1px solid #eee; border-radius: 12px; padding: 1.25rem; }
    .amount { font-size: 2rem; font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .err { color: #c62828; }
  </style>
</head>
<body>
  <h1>Splitr.</h1>
  <div id="root" class="muted">Loading…</div>
  <script>
    // ponytail: set at deploy to match mobile Supabase project (anon key is public).
    const SUPABASE_URL = 'REPLACE_WITH_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'REPLACE_WITH_SUPABASE_ANON_KEY';

    const token = new URLSearchParams(location.search).get('t');
    const root = document.getElementById('root');

    if (!token) {
      root.innerHTML = '<p class="err">Missing share token.</p>';
    } else if (!SUPABASE_URL.startsWith('http')) {
      root.innerHTML = '<p class="err">Share reader not configured on this host.</p>';
    } else {
      fetch(
        `${SUPABASE_URL}/rest/v1/public_share_links?token=eq.${encodeURIComponent(token)}&select=payload,expires_at`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      )
        .then((r) => r.json())
        .then((rows) => {
          if (!rows.length) {
            root.innerHTML = '<p class="err">Link expired or not found.</p>';
            return;
          }
          const p = rows[0].payload || {};
          if (p.type === 'monthly_recap') {
            root.innerHTML = `
              <div class="card">
                <p class="muted">Monthly recap</p>
                <p class="amount">₹${Number(p.totalSpent || 0).toLocaleString('en-IN')}</p>
                <p>${p.monthLabel || ''}</p>
                <p class="muted">${p.trendLabel || ''}</p>
              </div>
              <p class="muted" style="margin-top:1rem">Shared via Splitr</p>`;
          } else {
            root.innerHTML = `<pre class="card">${JSON.stringify(p, null, 2)}</pre>`;
          }
        })
        .catch(() => {
          root.innerHTML = '<p class="err">Could not load summary.</p>';
        });
    }
  </script>
</body>
</html>
