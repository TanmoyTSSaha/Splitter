<!DOCTYPE html>

<html lang="en">

  <head>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening Splitr…</title>

    <style>

      body {

        font-family: system-ui, sans-serif;

        margin: 0;

        min-height: 100vh;

        display: grid;

        place-items: center;

        background: #ffffff;

        color: #111111;

      }

      main {

        text-align: center;

        padding: 24px;

        max-width: 360px;

      }

      button {

        margin-top: 16px;

        padding: 12px 20px;

        border: none;

        border-radius: 12px;

        background: #111111;

        color: #ffffff;

        font-size: 16px;

        cursor: pointer;

      }

    </style>

  </head>

  <body>

    <main>

      <h1>Opening Splitr…</h1>

      <p id="status">If nothing happens, tap the button below.</p>

      <button id="open-app" type="button" hidden>Open Splitr</button>

    </main>

    <script>

      (function () {

        var search = window.location.search || "";

        var hash = window.location.hash || "";

        var isWeb = sessionStorage.getItem("splitr_oauth_context") === "web";



        if (isWeb) {

          sessionStorage.removeItem("splitr_oauth_context");

          window.location.replace("/app/oauth/callback" + search + hash);

          return;

        }



        var target = "splitr://login-callback/" + search + hash;

        var status = document.getElementById("status");

        var button = document.getElementById("open-app");



        function openApp() {

          window.location.href = target;

        }



        button.addEventListener("click", openApp);

        status.textContent = "Redirecting to the Splitr app…";

        button.hidden = false;

        openApp();

      })();

    </script>

  </body>

</html>
