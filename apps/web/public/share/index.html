<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Splitr Monthly Recap</title>
    <meta name="description" content="Monthly spending recap on Splitr" />
    <style>
      :root {
        color-scheme: dark;
        --bg0: #0f0f12;
        --bg1: #1a1a2e;
        --accent: #00e6a8;
        --text: #f5f5f5;
        --muted: #9aa0a6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(145deg, var(--bg0), var(--bg1));
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 28px 24px;
        background: rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      .label {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .hero {
        margin: 20px 0 8px;
        font-size: 2rem;
        font-weight: 800;
        color: var(--accent);
      }
      .row {
        margin-top: 12px;
        font-size: 0.95rem;
      }
      button {
        margin-top: 24px;
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        font-weight: 600;
        background: var(--accent);
        color: #111;
        cursor: pointer;
      }
      .error {
        color: #ff8a80;
        margin-top: 12px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Splitr</div>
      <h1 id="title">Monthly Recap</h1>
      <p id="subtitle">Loading recap…</p>
      <div class="hero" id="total" hidden></div>
      <div class="row" id="trend" hidden></div>
      <div class="row" id="category" hidden></div>
      <div class="row" id="persona" hidden></div>
      <p class="error" id="error" hidden></p>
      <button id="open-app" type="button">Open in Splitr</button>
    </main>
    <script src="/share/config.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get("t");
        var config = window.__SPLITR__ || {};

        var title = document.getElementById("title");
        var subtitle = document.getElementById("subtitle");
        var totalEl = document.getElementById("total");
        var trendEl = document.getElementById("trend");
        var categoryEl = document.getElementById("category");
        var personaEl = document.getElementById("persona");
        var errorEl = document.getElementById("error");
        var openBtn = document.getElementById("open-app");

        function showError(message) {
          errorEl.hidden = false;
          errorEl.textContent = message;
        }

        function renderPayload(payload) {
          var month = payload.monthLabel || "This month";
          title.textContent = month + " Recap";
          subtitle.textContent = "Shared from Splitr";
          if (payload.totalSpent != null) {
            totalEl.hidden = false;
            totalEl.textContent = "₹" + Number(payload.totalSpent).toLocaleString();
          }
          if (payload.trendLabel) {
            trendEl.hidden = false;
            trendEl.textContent = payload.trendLabel;
          }
          if (payload.topCategory) {
            categoryEl.hidden = false;
            categoryEl.textContent = "Top: " + payload.topCategory;
          }
          if (payload.persona) {
            personaEl.hidden = false;
            personaEl.textContent = payload.persona;
          }
        }

        async function loadRecap() {
          if (!token) {
            subtitle.textContent = "Open this link from the Splitr app.";
            showError("Missing share token.");
            return;
          }

          openBtn.addEventListener("click", function () {
            window.location.href = "splitr://share/?t=" + encodeURIComponent(token);
          });

          if (!config.supabaseUrl || !config.anonKey) {
            subtitle.textContent = "Tap below to view this recap in the app.";
            return;
          }

          try {
            var url =
              config.supabaseUrl +
              "/rest/v1/public_share_links?token=eq." +
              encodeURIComponent(token) +
              "&select=payload,expires_at";
            var res = await fetch(url, {
              headers: {
                apikey: config.anonKey,
                Authorization: "Bearer " + config.anonKey,
              },
            });
            if (!res.ok) throw new Error("Could not load recap");
            var rows = await res.json();
            if (!rows.length) throw new Error("Recap link expired or not found");
            var row = rows[0];
            if (row.expires_at && new Date(row.expires_at) < new Date()) {
              throw new Error("Recap link expired");
            }
            renderPayload(row.payload || {});
          } catch (err) {
            subtitle.textContent = "Tap below to view in the app.";
            showError(err.message || "Could not load recap");
          }
        }

        loadRecap();
      })();
    </script>
  </body>
</html>
